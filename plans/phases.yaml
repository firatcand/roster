phases:
  - id: "phase-1"
    name: "Host-led Framework Skeleton"
    status: "active"
    goal: "The scaffold, context, tool-guidance, evidence, and learning loop works end-to-end with seed data while Claude Code or Codex remains the runtime."
    gate_criteria:
      - "The ratified product contract assigns plan interpretation, subagents, tools, approvals, retries, scheduling, and rendering to Claude Code or Codex; Roster owns scaffolding, validation, context, Brain, evidence, and learning state."
      - "A fresh seed workspace creates only requested structures and both host fixtures discover the same qualified function, agent, structured plan, guideline, lesson, and tool-use definition."
      - "Roster statically validates the whole plan and returns one deterministic bounded context bundle for a host-supplied task and optional step hint without a compiler, reducer, current-step cursor, or provider route."
      - "Both hosts interpret the plan, consume the same company-use guidance and vendor skill reference, record mock portable evidence, observe a mock Dreamer due signal, and complete without Roster scheduling or execution state."
      - "Every generated output is schema-valid, secret-free, trust-separated, workspace-confined, and within its configured budget."
      - "pnpm typecheck, pnpm build, pnpm test, pnpm test:scaffold-scripts, and pnpm smoke pass."
    tasks:
      - id: "P1-T01"
        tracker_issue_id: "343"
        title: "Ratify the host-owned runtime contract"
        description: "Make the approved architecture durable: Roster is the thin scaffolding, context, company Brain, evidence, and learning layer; Claude Code or Codex interprets plans and executes work. Correct the BRIEF, PRD, SPEC, CONTEXT, investigation, tracker, and Forge lifecycle mismatch before implementation begins."
        type: "docs"
        priority: "P0"
        depends_on: []
        estimate: "S"
        owner_type: "human"
        acceptance:
          - "BRIEF, PRD, SPEC, CONTEXT, investigation, epic, and child task bodies agree on scaffold → resolve → host executes → record → learn."
          - "The contract protects functions, role agents, structured plans, Brain, tool-use definitions, portable evidence, Dreamer, and thin host activation."
          - "Plan compiler/reducer, current-step state, provider execution/router, Roster scheduling, general ops/HITL, and approval authority are explicit non-goals."
          - "The repository either tracks the documented Forge spec authority or corrects the Forge-managed project instructions so future update-spec propagation is atomic and non-contradictory."

      - id: "P1-T02"
        tracker_issue_id: "342"
        title: "Build sparse workspace registry and scaffolding"
        description: "Replace eager template-tree creation with a versioned canonical registry and deterministic scaffold/discover verbs for functions, agents, plans, subagents, guidelines, tool-use definitions, and lessons. Preserve hierarchical ownership while creating optional structures only on request."
        type: "foundation"
        priority: "P0"
        depends_on: ["P1-T01"]
        estimate: "M"
        owner_type: "backend-dev"
        acceptance:
          - "roster init creates only roster.yaml and short ROSTER.md; host install creates reproducible generated activation files."
          - "roster scaffold and roster discover create/resolve qualified records, including same-named agents in different functions, without collisions."
          - "Optional directories and state appear only on first use; no empty tree or .gitkeep forest is emitted."
          - "Authored/generated ownership, bounded reads, atomic writes, workspace confinement, component-wise symlink safety, and actionable drift diagnostics apply consistently."

      - id: "P1-T03"
        tracker_issue_id: "344"
        title: "Validate structured host-interpreted plans"
        description: "Define the bounded versioned plan schema and static validation/reference-resolution path for ordered reasoning, subagent, cross-agent, nested-plan, tool, approval, and artifact guidance. Return the complete plan to the host and introduce no Roster execution grammar."
        type: "foundation"
        priority: "P0"
        depends_on: ["P1-T02"]
        estimate: "M"
        owner_type: "backend-dev"
        acceptance:
          - "The schema validates purpose, inputs, ordered unique steps, expected artifacts/output guidance, completion criteria, caps, retry/condition guidance, and approval guidance."
          - "Missing agent/subagent/nested-plan/guideline/Brain-selector/tool-use references and direct or transitive plan cycles fail before work begins."
          - "YAML bytes, aliases, nodes, scalars, and nesting are bounded; arbitrary code, shell, hidden expressions, goto, workers, and queues are rejected."
          - "No compiler, reducer, active plan snapshot, current-step cursor, runtime type gate, next/submit/approve protocol, or transition test is added."

      - id: "P1-T04"
        tracker_issue_id: "347"
        title: "Define scoped workspace tool-use guidance"
        description: "Implement workspace/function/agent/plan tool-use definitions that reference external vendor skills and describe this company's purpose, relevant capabilities, filters, business rules, expected results, approval guidance, Brain reads/writes, and evidence requirements."
        type: "integration"
        priority: "P0"
        depends_on: ["P1-T02"]
        estimate: "M"
        owner_type: "integration"
        acceptance:
          - "A strict schema and most-specific-wins precedence resolve tool-use definitions and canonical skill_ref identities deterministically."
          - "Definitions contain no raw secrets and may narrow but cannot silently relax broader safety policy."
          - "Generated adapters map canonical skill refs to installed host-specific locations while vendor skills remain authoritative for setup, auth, syntax, parsing, compatibility, and generic best practices."
          - "Roster validates and returns guidance only; no external provider route, health check, fallback, credential injection, child process, MCP/API/browser execution, or provider result gate is added."

      - id: "P1-T05"
        tracker_issue_id: "346"
        title: "Resolve bounded seeded task context"
        description: "Build the deterministic context request/response contract over one validated workspace snapshot: selected function/agent policy, an optional root plus its complete transitive nested-plan definition closure, mandatory step-referenced effective tool/skill pairs, optional approved lessons, and optional fake Brain evidence. The host supplies the target, task, optional step hint, and budget and remains the sole workflow runtime."
        type: "backend"
        priority: "P0"
        depends_on: ["P1-T03", "P1-T04"]
        estimate: "M"
        owner_type: "backend-dev"
        acceptance:
          - Equivalent inputs produce semantically identical bundles for Claude Code and Codex with stable identities, hashes, trust classes, inclusion reasons, and deterministic budget accounting.
          - A selected root plan returns first with the complete deduplicated transitive nested-plan definition closure from one validated snapshot; Roster selects no current step and executes nothing.
          - Required function/agent/policy content and every closure tool-step effective tool-use/canonical-skill pair are reserved before optional approved lessons or Brain evidence; membership catalogs select nothing.
          - Missing Brain configuration returns the complete local bundle, empty evidence, exit zero, and one warning diagnostic; optional retrieval failures and candidate diagnostic examples cannot corrupt mandatory context.
          - Reachable required overflow reports an exact accepted retry and an above-ceiling mandatory minimum reports a distinct unservable error; neither emits a partial bundle.
          - Authored policy, approved lessons, vendor instructions, Brain evidence, and tool output remain structurally trust-separated, with no Roster-selected current step, prior-output binding, provider route, approval receipt, next action, or transition.

      - id: "P1-T06"
        tracker_issue_id: "349"
        title: "Generate thin Claude Code and Codex adapters"
        description: "Generate versioned adapters that teach both hosts the same lifecycle: discover, retrieve context, interpret the whole plan, load vendor skills, execute, record completed evidence, check Dreamer readiness, and present human decisions."
        type: "integration"
        priority: "P0"
        depends_on: ["P1-T05"]
        estimate: "M"
        owner_type: "integration"
        acceptance:
          - "Generated files are reproducible, versioned, hash-identifiable, drift-detectable, and never canonical authoring sources."
          - "Both adapters consume the same host-neutral command/data contracts and preserve trust separation."
          - "Adapters contain no business-agent plan logic, provider secret, scheduler, reducer, approval authority, or alternate source of truth."
          - "Fixtures report supported, advisory, missing, or drifted activation capabilities for each host."

      - id: "P1-T07"
        tracker_issue_id: "350"
        title: "Prove the seeded host-led learning loop"
        description: "Add the smallest end-to-end seed scenario across both host fixtures: sparse scaffold, discovery, validated structured plan, bounded context, cited fake Brain evidence, scoped fake tool use, completed evidence, Dreamer due, human-approved candidate, and next-context lesson selection."
        type: "integration"
        priority: "P0"
        depends_on: ["P1-T06"]
        estimate: "M"
        owner_type: "qa-engineer"
        acceptance:
          - "A human-style request enters each host fixture with no simulated human Roster command."
          - "Each host interprets the complete plan and fake tool-use guidance itself and produces an equivalent semantic result."
          - "Mock portable completed-run/feedback evidence produces one durable due signal; each host then invokes the Dreamer skill, producing one idempotent cited candidate."
          - "Simulated human promotion materializes a lesson and changes the next applicable context bundle without a Roster schedule, execution engine, or approval receipt."

  - id: "phase-2"
    name: "Real Company Context and Learning"
    status: "blocked"
    blocked_by: "phase-1"
    goal: "Both adopters complete real host-interpreted work with live company Brain context, declared external tools, portable evidence, and activated Dreamer learning."
    gate_criteria:
      - "A selected real file, fetched medium, text, structured record, or produced artifact converges into an authorized company Brain source/version and S3 object, then returns through bounded context with immutable citations."
      - "A real external vendor skill is selected through authored workspace tool-use guidance and executed by each host with provenance; Roster never becomes the connection or execution layer."
      - "Completed runs, artifacts, feedback, and portable human-decision evidence have one Brain-backed authority separate from normal semantic knowledge."
      - "Evidence creates durable Dreamer readiness, both hosts invoke reflection without a Roster schedule, and a human-approved lesson changes a later context bundle."
      - "Adopter retrieval and end-to-end context gold sets pass required recall, exclusion, citation, determinism, latency, privacy, and at least 60 percent token-reduction thresholds."
      - "my-roster and roster-lobu each complete a representative real host-interpreted workflow and learning cycle."
      - "pnpm typecheck, pnpm build, pnpm test, pnpm test:scaffold-scripts, and pnpm smoke pass."
    tasks:
      - id: "P2-T01"
        tracker_issue_id: "351"
        title: "Establish workspace Brain authority"
        description: "Give each logical Roster workspace one portable non-secret Brain identity and one protected PostgreSQL/S3-compatible authority before company-content lifecycle behavior. Brain is optional for local workspace behavior but, when activated, requires both services. The database is the workspace isolation boundary; workspace/function/agent/plan scopes remain retrieval labels rather than authorization principals."
        type: "foundation"
        priority: "P0"
        depends_on: ["P1-T07"]
        estimate: "M"
        owner_type: "db-architect"
        acceptance:
          - Strict optional roster.yaml Brain configuration stores the stable workspace_id, a generic tracked secret path/reference, and normalized non-secret S3-compatible bucket/optional-root-prefix organization without credentials; retired brain.binding input fails with migration guidance.
          - No Brain configuration preserves healthy local scaffolding, discovery, validation, context, and external-tool guidance; declaring only PostgreSQL or only object storage fails closed as BRAIN_CONFIGURATION_INCOMPLETE before either service is opened.
          - The host owns a strong workspace-specific ROSTER_BRAIN_URL through its chosen ambient credential mechanism. Init validates the derived role and credential, never mints, stores, returns, prints, or silently rotates it, and requires an available compatible object namespace in the same activation.
          - One transaction on one locked physical client creates migrations, protected identity, and grants for a truly uninitialized database; identical initialization is idempotent, while any nonempty unidentified Brain requires explicit reviewed adoption without mutation.
          - Every authority-managed admin or runtime connection performs only the protected-metadata handshake before exposing caller operations; missing, migrating, workspace-mismatch, and namespace-mismatch states fail closed with redacted diagnostics.
          - The runtime path can read but cannot mutate protected identity, and a checkout relocation carrying the same authored workspace ID reaches the same remote Brain.
          - S3-compatible endpoint and namespace validation is bounded, secret-free, capability-based, and fail-closed; this task never reads, writes, or deletes company object bytes.

      - id: "P2-T02"
        tracker_issue_id: "370"
        title: "Build Brain extraction and indexing"
        description: "Separate versioned extraction and indexing from source identity inside a completely activated Brain: current-version text/chunks, lexical indexes, privacy-permitted optional provider-neutral embeddings, resumable reindex, extractor/model metadata, and correct embedding-free behavior."
        type: "data"
        priority: "P0"
        depends_on: [P2-T13]
        estimate: "L"
        owner_type: "db-architect"
        acceptance:
          - Extraction and indexing require the verified PostgreSQL-plus-S3-compatible Brain authority and never treat a partial Brain as usable.
          - Every extract/chunk points to one immutable source version and records extractor identity/version and locators.
          - Lexical/structured indexing works without an embedding credential; embedding absence or failure degrades explicitly without corrupting source readiness.
          - Embedding permission is privacy-aware, records provider/model/dimensions/version, and never sends secret-class content.
          - Reindex is resumable/idempotent and current-version filtering prevents stale chunk or vector leakage.

      - id: "P2-T03"
        tracker_issue_id: "352"
        title: "Connect cited company Brain retrieval"
        description: "Connect scope-eligible current-version structured, lexical, optional embedding, and configured graph retrieval to the context resolver using one immutable citation envelope and deterministic reason codes."
        type: "data"
        priority: "P0"
        depends_on: ["P2-T02", "P1-T05"]
        estimate: "L"
        owner_type: "backend-dev"
        acceptance:
          - Default retrieval excludes superseded, tombstoned, scope-ineligible, privacy-incompatible, and legacy-unverified content.
          - A host may explicitly request legacy-unverified evidence; returned items retain that trust label and can never become authority, policy, or instructions.
          - Keyword/structured retrieval remains correct when embeddings are disabled or unavailable.
          - Every result resolves exact source/object/extractor versions, locator, trust/privacy class, scope, and retrieval reason.
          - Structured entities/facts/events/edges and document extracts can coexist in one bounded context without provenance loss.

      - id: "P2-T04"
        tracker_issue_id: "353"
        title: "Evaluate adopter retrieval quality"
        description: "Build sanitized, distributable gold sets from representative company-context queries and measure current-version filtering, retrieval-label correctness, lexical retrieval, optional embeddings/graph expansion, citation completeness, latency, cost, privacy, and activation thresholds for advanced retrieval."
        type: "data"
        priority: "P0"
        depends_on: ["P2-T03"]
        estimate: "M"
        owner_type: "qa-engineer"
        acceptance:
          - Gold sets contain no private workspace names, paths, Brain contents, credentials, or live snapshots and record queries, relevant immutable source versions/structured records, explicit exclusions, and expected retrieval eligibility.
          - Every Brain-backed fixture supplies both hermetic PostgreSQL and S3-compatible services; embeddings remain optional and provider-neutral.
          - Recall@k, precision/exclusion, citation completeness, latency, cost, and privacy results are reproducible.
          - The evaluation recommends evidence-based dispositions for trigram aliases, default embeddings, multi-hop graph, automatic edges, and hosted reranking.
          - No advanced retrieval feature becomes a launch requirement solely because it already exists or was previously proposed.

      - id: "P2-T05"
        tracker_issue_id: "354"
        title: "Validate real host-executed tool use"
        description: "Prove the provider-neutral host tool-use boundary with multiple small hermetic provider/surface skill bindings and company use cases. Claude Code and Codex derive request inputs, invoke the referenced skill, and report provenance while Roster only validates and resolves authored guidance. Add one skip-by-default smoke against an explicitly selected installed public skill through a currently logged-in host, without a named live-provider CI dependency."
        type: "integration"
        priority: "P0"
        depends_on: ["P1-T04", "P1-T06"]
        estimate: "M"
        owner_type: "integration"
        acceptance:
          - Hermetic fixtures use multiple distinct skill_ref provider/surface bindings and use cases, including at least one non-search or non-MCP shape.
          - Each workspace definition captures purpose, scope, capabilities, company filters/rules, expected fields, optional Brain intent, effects, approval guidance, and evidence requirements without provider setup or secrets.
          - The referenced installed or workspace-local skill remains authoritative for installation, authentication, syntax, parsing, provider compatibility, and generic best practices.
          - Both hosts resolve equivalent guidance, derive request-specific inputs, execute the fixture skill, and report sanitized provenance without a Roster executor, router, health/fallback layer, credential injector, response parser, or custom receipt system.
          - The optional live smoke uses normal logged-in host state, is skipped when not explicitly configured, commits no personal configuration or provider response, and requires no direct model/provider API key or named commercial provider in CI.
          - A fixture without Brain requires no infrastructure; any fixture using Brain supplies both PostgreSQL and S3-compatible storage.

      - id: "P2-T06"
        tracker_issue_id: "355"
        title: "Connect live bounded context resolution"
        description: "Replace seeded candidates with live deterministic selection across Working Directory policy, complete selected plan, approved lessons, cited company Brain evidence, and scoped tool-use guidance."
        type: "backend"
        priority: "P0"
        depends_on: ["P2-T03", "P2-T05"]
        estimate: "M"
        owner_type: "backend-dev"
        acceptance:
          - "The resolver applies scope, trust, privacy, freshness, precedence, deduplication, and hard budget rules deterministically."
          - "Required overflow, unavailable optional retrieval, stale/conflicting lessons, and hostile evidence have explicit non-corrupting behavior."
          - "Explain output accounts for every inclusion and exclusion with stable citation and budget metadata."
          - "The request is host supplied and no active-run, prior-output, current-step-selection, provider-route, or continuation semantics appear."

      - id: "P2-T07"
        tracker_issue_id: "356"
        title: "Record canonical portable work evidence"
        description: "Extract a minimal Brain-backed evidence core for completed runs, artifacts, source/tool summaries, outcomes, feedback, and action-digest-bound human decisions. Keep it separate from semantic company knowledge and delete assumptions that evidence advances execution."
        type: "data"
        priority: "P0"
        depends_on: ["P2-T13", "P1-T07"]
        estimate: "L"
        owner_type: "backend-dev"
        acceptance:
          - "Completed-run evidence records host/Roster versions, agent/plan, request hash/summary, timing, outcome, citations/tools, artifacts, provenance, and feedback links without a step state machine."
          - "Operational rows and S3 prefixes are excluded from normal embeddings and semantic retrieval unless explicitly promoted with lineage."
          - "Equivalent replay is idempotent and conflicting replay fails without mutation."
          - "A human-decision record is portable evidence only; the host still prompts, waits, enforces native safety, and decides execution."

      - id: "P2-T08"
        tracker_issue_id: "357"
        title: "Compute durable Dreamer readiness"
        description: "Derive idempotent due/not_due state from eligible completed-run and feedback evidence using versioned policies, thresholds, cooldowns, scopes, and durable watermarks. Expose status without dispatching or scheduling reflection."
        type: "backend"
        priority: "P0"
        depends_on: ["P2-T07"]
        estimate: "M"
        owner_type: "backend-dev"
        acceptance:
          - "Below-threshold observations remain durable and later contribute to readiness."
          - "Equivalent checks at the same watermark return the same status without creating candidates or dispatching host work; the stable watermark lets host activation deduplicate safely."
          - "Status explains policy version, scope, evidence count/range, watermark, cooldown, and due/not_due reasons."
          - "No daemon, cron, polling, model invocation, candidate creation, or host next-action dispatch occurs in the status command."

      - id: "P2-T09"
        tracker_issue_id: "358"
        title: "Implement the host-run Dreamer lesson lifecycle"
        description: "Rebuild Dreamer as a Roster skill that queries eligible Brain evidence, detects recurring patterns, drafts cited candidates with counterevidence, stores them idempotently, and materializes only host-confirmed lessons into scoped workspace playbooks."
        type: "backend"
        priority: "P0"
        depends_on: ["P2-T03", "P2-T08"]
        estimate: "M"
        owner_type: "backend-dev"
        acceptance:
          - "Candidates cite supporting, conflicting, and counterexample runs and declare intended workspace/function/agent/plan scope."
          - "Dreamer output cannot count as independent evidence for itself and untrusted evidence cannot inject instructions."
          - "Create/revise/promote/reject/retire decisions are idempotent, durable, and preserve lineage."
          - "Promotion requires human confirmation by default and writes a reviewable Git lesson selected by later context."

      - id: "P2-T10"
        tracker_issue_id: "359"
        title: "Activate Dreamer reliably through both hosts"
        description: "Update generated Claude Code and Codex activation so readiness is checked after evidence recording and again on the next Roster-backed interaction; when due the host invokes Dreamer and presents candidates without a Roster schedule or Slack queue."
        type: "integration"
        priority: "P0"
        depends_on: ["P1-T06", "P2-T09"]
        estimate: "M"
        owner_type: "integration"
        acceptance:
          - "Both host fixtures automatically act on due status after evidence recording and recover a missed check on the next interaction."
          - "The singular log/ versus plural logs/ mismatch and manual/schedule-only trigger paths are removed."
          - "Repeated activation at one watermark does not create duplicate candidates or repeatedly prompt the human."
          - "Doctor distinguishes Dreamer files existing from the complete readiness → invocation → candidate → decision activation path working."

      - id: "P2-T11"
        tracker_issue_id: "371"
        title: "Evaluate end-to-end runtime context quality"
        description: "Use sanitized representative gold tasks to measure the full context bundle—not only retrieval—for required-context recall, irrelevant-context exclusion, citation completeness, deterministic selection, trust separation, latency, and token reduction across local-only and complete-Brain configurations."
        type: "integration"
        priority: "P0"
        depends_on: ["P2-T04", "P2-T06"]
        estimate: "M"
        owner_type: "qa-engineer"
        acceptance:
          - Gold tasks contain no private workspace identifiers or contents and identify mandatory plan/policy/lesson/tool/Brain fragments, acceptable alternatives, and explicit exclusions.
          - Both hosts receive semantically equivalent bundles and every included/excluded fragment has an explanation.
          - Sanitized representative tasks use at least 60 percent fewer tokens than a frozen eager-load baseline without losing required context.
          - Local-only tasks need no infrastructure; Brain-backed tasks use complete PostgreSQL and S3-compatible fixtures with optional embeddings.
          - Measured failures block representative workflow proof and produce targeted corrections rather than being hidden by aggregate retrieval scores.

      - id: "P2-T12"
        tracker_issue_id: "360"
        title: "Prove real host-interpreted adopter workflows"
        description: "Run the complete v2 loop on two sanitized, distinct representative workflows through Claude Code and Codex, with host-interpreted plans, provider-neutral external skill bindings, portable evidence, Dreamer activation, human promotion, and later lesson selection. Brain-backed workflow steps use complete PostgreSQL and S3-compatible fixtures; local-only steps remain infrastructure-free."
        type: "integration"
        priority: "P0"
        depends_on: ["P2-T05", "P2-T06", "P2-T07", "P2-T10", "P2-T11"]
        estimate: "L"
        owner_type: "qa-engineer"
        acceptance:
          - Two distinct sanitized representative workflows complete a human-style task through both hosts with the host explicitly interpreting the authored YAML plan.
          - External tool bindings exercise different provider/surface shapes; the host executes them and Roster contains no business-specific or provider-specific executor.
          - Brain-backed steps include cited context from both hermetic PostgreSQL and S3-compatible storage; any local-only step proves the thin core works without infrastructure.
          - Completed evidence makes Dreamer due, a human-approved candidate becomes a lesson, and the lesson affects the next applicable context.
          - Context quality, secret safety, retrieval-label correctness, idempotency, and interruption recovery thresholds pass without private live workspace dependencies.
      - id: P2-T13
        tracker_issue_id: GH-381
        title: Build recoverable Brain source lifecycle
        description: Define checkout-independent logical source identity, immutable source versions, content-addressed object storage, tombstones, and one resumable Postgres/S3 ingestion path. Roster receives bytes and metadata selected by Claude Code or Codex; it does not fetch providers, extract or retrieve content, execute plans, schedule work, or approve actions.
        type: data
        priority: P0
        depends_on: [P2-T01]
        estimate: L
        owner_type: db-architect
        acceptance:
          - Files and fetched media derive checkout-independent continuing identity; inline text, structured records, and produced artifacts require a bounded host-supplied stable key.
          - Immutable objects, logical sources, source versions, typed retrieval labels, privacy/trust/actor assurance, tombstones, and durable ingest intents are stored without Brain-space or cross-scope RLS tenancy.
          - One content-addressed flow performs durable prepare, S3 create-or-verify, and transactional publish without holding a database transaction across S3.
          - Every S3 request enforces the tracked HTTPS origin and exact host/port, resolves through a bounded policy, and revalidates all resolved addresses at request time so DNS rebinding cannot reach localhost, private, link-local, or other forbidden targets.
          - Identical retries converge; changed requests conflict; changed bytes preserve history; concurrent divergent publishes cannot rewind current; exact tombstone restoration is atomic.
          - Report-first inspection and explicit repair resume only provable intent-owned work after every Postgres/S3 failure boundary; missing bytes are never fabricated or silently adopted.
          - Phase-2 lifecycle operations never delete S3 objects, and focused identity, immutability, concurrency, relocation, policy, and recovery tests pass.
        write_globs:
          - data/brain/schema/*source*
          - src/lib/brain/source-*
          - src/lib/brain/object-store.ts
          - src/lib/brain/ingest.ts
          - test/brain-source-*
          - test/brain-ingest-*
      - id: P2-T14
        tracker_issue_id: GH-382
        title: Inventory legacy Brain state
        description: Create a deterministic, bounded, redacted inventory of legacy PostgreSQL and S3-compatible state before lifecycle backfill. This ticket reads and reports only; it performs no schema migration, source derivation, object copy, backfill, role change, live-workspace mutation, schedule removal, or public import/export.
        type: data
        priority: P0
        depends_on: [P2-T01]
        estimate: M
        owner_type: db-architect
        acceptance:
          - Inventory requires an explicitly designated complete PostgreSQL-plus-S3-compatible legacy Brain and refuses partial configuration before reading either service.
          - A bounded inventory records migration and schema hashes, table definitions, row counts and stable IDs, role/default-ACL state, custom tables, legacy content structures, and all object versions and delete markers.
          - Absolute, temporary, and foreign paths; reused hashes; missing bytes; mutable-key history; ETag or version drift; and ambiguous ownership become explicit redacted findings.
          - Canonical manifest bytes and digest are deterministic across retries, and pagination or resume cannot omit or duplicate rows or object history.
          - Reports contain no credentials, secret values, company-content bodies, URLs with userinfo, complete absolute paths, or private workspace identifiers.
          - A compact sanitized fixture proves multiple object versions, delete markers, drift, missing bytes, custom tables, deterministic replay, and read-only behavior without accessing any real workspace.
        write_globs:
          - src/lib/brain/*inventory*
          - src/lib/brain/backup-shared.ts
          - src/lib/persistence/s3-core.ts
          - test/brain-legacy-inventory.test.ts
          - test/fixtures/brain-legacy-*
      - id: P2-T15
        tracker_issue_id: GH-383
        title: Close and expose Brain runtime
        description: Expose the verified first-party Brain source pipeline to Claude Code and Codex through the canonical Brain CLI while replacing direct database mutation with fixed least-privilege runtime operations. Brain activation requires complete PostgreSQL and S3-compatible configuration. External tools remain host/skill-executed; Roster adds no workflow reducer, external-provider executor, scheduler, queue, or approval authority.
        type: integration
        priority: P0
        depends_on: [P2-T13]
        estimate: L
        owner_type: backend-dev
        acceptance:
          - Brain init, ingest, doctor, fs, semantic writes, and every retained Brain command reject partial PostgreSQL/S3-compatible configuration and use verified workspace authority; local-only Roster commands remain unaffected.
          - The runtime role cannot create, alter, or drop schema; own protected objects; change workspace identity or provenance; bypass fixed brokers; or directly mutate lifecycle state.
          - Doctor and migration diagnostics may inspect protected metadata before identity is ready but cannot read company content or touch object storage.
          - "Legacy spellings mount, table, sql, config, reindex, gc, export, and import remain recognized but fail closed with stable diagnostics until their one-way removal in #363."
          - "Brain query remains recognized but fails with BRAIN_RETRIEVAL_NOT_READY until #370 and #352; default context excludes legacy-unverified evidence while preserving it for explicit future retrieval."
          - Explicit runtime credential rotation uses a previously authenticated runtime role or reviewed provider-admin recovery path, updates the operator-selected credential store without printing secrets, and cannot be triggered as an init side effect.
          - Save, event, link, and merge cite an immutable structured-record source version, and fs removal records a tombstone without deleting object bytes.
          - CLI parsing, help, JSON errors, skills, templates, docs, negative role tests, and both host harnesses pass without API-key-only or named-provider dependencies.
        write_globs:
          - data/brain/schema/*runtime*
          - src/commands/brain.ts
          - src/lib/brain-args.ts
          - src/lib/brain/roles.ts
          - src/lib/brain/doctor.ts
          - src/lib/brain/fs.ts
          - src/lib/brain/{save,event,link,merge,get}.ts
          - src/bin/roster.ts
          - test/brain-runtime-*
          - test/cli-brain.test.ts
          - README.md
          - docs/{API,HOWTO}.md
          - skills/brain/SKILL.md
      - id: P2-T16
        tracker_issue_id: GH-384
        title: Backfill legacy Brain history
        description: "Compose an approved, sanitized legacy inventory manifest with the production source pipeline to preserve structured knowledge, graph history, source lineage, and verifiable object history. This ticket provides internal backfill and repair primitives only; #363 remains responsible for explicit workspace dry-run/apply cutover."
        type: data
        priority: P0
        depends_on: [P2-T13, P2-T14]
        estimate: L
        owner_type: db-architect
        acceptance:
          - Backfill requires a complete PostgreSQL-plus-S3-compatible Brain, accepts only the exact approved inventory digest, acquires the remote migration lock, and resumes idempotently without rereading unapproved state.
          - Existing entities, aliases, facts, events, edges, merges, documents, file history, IDs, timestamps, redirects, and verifiable object bytes remain intact with legacy-unverified source lineage.
          - Proven workspace-relative paths retain stable identity; absolute paths become non-authoritative legacy locators; temporary, foreign, ambiguous, drifted, and missing-byte inputs are never guessed.
          - Equal bytes may reuse one immutable object without merging logical sources; put, remove, and re-put history preserves tombstones; chunks never fabricate unavailable raw bytes.
          - Crash recovery and repeated repair converge without changing original rows or keys, deleting object bytes, or making legacy-unverified evidence eligible for default retrieval.
          - Sanitized fixtures prove exact count and ID parity, object-version matching, conflicts, resume, and no access to any real workspace.
        write_globs:
          - src/lib/brain/legacy-*
          - src/lib/persistence/migrate-core.ts
          - test/brain-legacy-backfill.test.ts
          - test/fixtures/brain-legacy-*

  - id: "phase-3"
    name: "Breaking Simplification and Launch"
    status: "blocked"
    blocked_by: "phase-2"
    goal: "Remove the accidental second runtime, migrate both adopters safely, harden the actual Roster boundaries, and release the smaller v2 product."
    gate_criteria:
      - "Roster scheduler/cron/fire/state and general operations/HITL/queue/lease/outbox/wake-resume surfaces are absent after minimal evidence primitives are extracted."
      - "The one-way migrator preserves authored policy and useful Brain/evidence history, removes only exact consented legacy targets, and passes frozen adopter rehearsals."
      - "Workspace paths, company Brain isolation, S3 endpoint trust, embedding privacy, vendor skill provenance, prompt trust separation, secret handling, and human-decision boundaries pass focused security tests."
      - "Generated adapters cannot silently drift and doctor proves the complete scaffold/context/Brain/tool/evidence/Dreamer activation path."
      - "Optional retrieval and non-core integrations have explicit measured keep/defer/remove decisions."
      - "Both adopters complete post-migration host-led workflows and Dreamer learning through Claude Code and Codex."
      - "All release commands, package inspection, secret scan, documentation, migration notes, and second-opinion review pass."
      - "pnpm typecheck, pnpm build, pnpm test, pnpm test:scaffold-scripts, and pnpm smoke pass."
    tasks:
      - id: "P3-T01"
        tracker_issue_id: "361"
        title: "Remove the Roster scheduling subsystem"
        description: "Delete Roster schedule commands, cron writers, registries, state/fire records, stale-fire logic, schedule-derived pending behavior, migration wrappers, templates, tests, docs, and package surfaces. Host-native scheduling starts the normal host-led Roster workflow."
        type: "backend"
        priority: "P0"
        depends_on: ["P2-T12"]
        estimate: "L"
        owner_type: "backend-dev"
        acceptance:
          - "No shipped CLI, template, migration, doc, test, or package file exposes Roster-owned scheduling, cron, fire/state, wake/resume, or schedule-derived pending behavior."
          - "Dreamer and business workflows remain reachable through normal interactive or host-native scheduled sessions."
          - "Migration targets only exact Roster-managed cron blocks with explicit consent and never changes host-native schedules."
          - "Full gates and focused absence/package tests pass."

      - id: "P3-T02"
        tracker_issue_id: "362"
        title: "Reduce general operations to the portable evidence core"
        description: "Extract only the storage/idempotency/trust primitives required by P2-T07, then delete general ops queues, local sealed ledger, overlay/dual backend, outbox, leases, sweeps, inbox, setup journals, capability negotiation, polling, wake/resume, and general HITL state."
        type: "backend"
        priority: "P0"
        depends_on: ["P2-T07", "P2-T12"]
        estimate: "L"
        owner_type: "backend-dev"
        acceptance:
          - "The minimal completed-run/artifact/feedback/human-decision evidence API remains portable and fully tested."
          - "General queue, lease, outbox, overlay, local-ledger, pending inbox, Slack HITL, polling, wake/resume, and execution-receipt code and tests are absent."
          - "Evidence cannot advance a workflow, authorize an action, or enter normal semantic retrieval without explicit promotion."
          - "Package size, CLI, schema, migrations, and docs reflect the smaller boundary."

      - id: "P3-T03"
        tracker_issue_id: "365"
        title: "Eliminate generated adapter and version drift"
        description: "Consolidate host-neutral activation content, generator/protocol versions, ownership markers, source hashes, safe sync, stale-shadow detection, and edited-generated-file handling so Claude Code and Codex cannot silently run different Roster contracts."
        type: "integration"
        priority: "P0"
        depends_on: ["P2-T10"]
        estimate: "M"
        owner_type: "integration"
        acceptance:
          - "Equivalent host adapters derive from one canonical contract and record generator/protocol/content versions."
          - "Sync updates unedited generated files, refuses edited generated files, and detects duplicate or stale host shadows."
          - "Authored files are never overwritten by regeneration and unsupported host capabilities are explicit."
          - "Drift fixtures cover partial installs, upgrades, deleted files, edited generated content, and mixed versions."

      - id: "P3-T04"
        tracker_issue_id: "364"
        title: "Harden Roster-owned security boundaries"
        description: "Threat-model and test only the boundaries Roster actually owns: bounded parsing, workspace/external paths, tracked workspace-to-database identity, workspace-owned S3 namespace confinement, least-privilege Brain roles, retrieval-label correctness, retrieval/context trust, embedding privacy, tool-use definitions/vendor skill provenance, evidence/decision semantics, migrations, and secret-free outputs."
        type: "infra"
        priority: "P0"
        depends_on: ["P2-T05", "P2-T06", "P2-T07", "P2-T09"]
        estimate: "L"
        owner_type: "security-auditor"
        acceptance:
          - Every default file read/write is workspace-confined and component-wise symlink safe; external access requires an exact host-obtained grant.
          - Adversarial tests prove that a logical workspace cannot activate a database with a different protected workspace_id or an unvalidated S3 namespace, and that mismatch rejection occurs after only the protected-metadata handshake and before company-content reads, S3 access, or mutation.
          - Least privilege prevents runtime schema mutation, protected workspace identity/provenance mutation, or bypass of the closed Brain write surface; no cross-workspace RLS, per-binding login, or per-agent credential model is introduced.
          - Retrieval scopes are tested as typed selection, ranking, explanation, and exclusion labels—not authorization principals—and privacy/trust/current-version/tombstone policy cannot be bypassed through crafted scope values.
          - HTTPS/endpoint trust, bucket/root-prefix and object-key confinement, embedding privacy, immutable vendor pins/provenance, and prompt trust separation have adversarial tests.
          - Secret canaries never appear in context, JSON, diagnostics, logs, migrations, artifacts, generated files, or package contents; decision evidence never bypasses host safety.

      - id: "P3-T05"
        tracker_issue_id: "368"
        title: "Decide optional capability dispositions from evidence"
        description: "Document measured keep/defer/remove decisions for capability classes such as alias search, embedding posture, graph expansion, automatic edge extraction, hosted reranking, external task-system workflows, second opinion, tripwire, and additional host adapters without promoting any example provider or treating lack of use as proof of low value."
        type: "docs"
        priority: "P1"
        depends_on: ["P2-T04", "P2-T12"]
        estimate: "S"
        owner_type: "human"
        acceptance:
          - Scaffolding, structured plans, first-party Brain/provenance, provider-neutral tool-use definitions, portable evidence, Dreamer, host activation, and doctor are explicitly protected core.
          - Each optional capability class cites quality, latency, cost, privacy, maintenance, product-demand, and activation evidence rather than one named vendor or private workflow.
          - Deferred issues state measurable activation thresholds and dependencies; removed surfaces have migration/archive dispositions.
          - Embedding remains optional, while complete PostgreSQL and S3-compatible storage remain mandatory whenever Brain is activated.
          - The release graph includes only capabilities justified for v2.

      - id: "P3-T06"
        tracker_issue_id: "363"
        title: "Build the one-way v2 workspace migrator"
        description: "Implement fingerprinted dry-run/apply migration for registry paths, structured plans, provider-neutral tool-use definitions, the tracked one-workspace Brain contract and in-place source-lifecycle upgrade, portable evidence, lessons, host adapters, generic secret references, schedule removal, and general-ops archival without permanent compatibility code."
        type: "infra"
        priority: "P0"
        depends_on: ["P3-T01", "P3-T02", "P3-T03", "P2-T02", "P2-T03", P2-T16]
        estimate: "L"
        owner_type: "backend-dev"
        acceptance:
          - Dry run classifies every preserve/transform/import/archive/delete/decision action and records fingerprints, conflicts, backup, intended workspace_id, tracked non-secret Brain configuration, database identity, object namespace, and possible secret-reference locations without secret values.
          - Local-only migration runs without infrastructure; a Brain cutover requires complete compatible PostgreSQL and S3-compatible configuration and rejects a partial target before reading or mutating either service.
          - Apply revalidates fingerprints, acquires workspace and remote locks, writes local files atomically, resumes remote idempotency state, and emits a redacted audit report.
          - Apply refuses Brain cutover until extraction/indexing and cited retrieval are complete and verified, so no migrated Brain becomes write-only.
          - A database with no protected identity initializes only the approved logical workspace; a different identity, ambiguous ownership, or unvalidated object namespace fails closed and becomes an explicit human-decision item.
          - Each Brain upgrades in place in its own database and object namespace, preserving verifiable structured knowledge, graph history, and object data without Brain spaces, cross-workspace RLS, permanent dual-write, or compatibility shims.
          - Legacy evidence imports only as legacy-unverified; secret key names become generic references without values; authored tool intent becomes reviewed skill references without provider-specific runtime code.
          - The reviewed cutover removes legacy Brain spellings, and only exact Roster-managed schedule targets are removed with consent while host-native schedules and authored edits remain.

      - id: "P3-T07"
        tracker_issue_id: "366"
        title: "Build v2 activation and integrity doctor"
        description: "Rewrite doctor around the v2 product: sparse scaffold/discovery, structured plan references, context budgets, no/partial/complete Brain activation, protected database identity, least-privilege roles, immutable source/object/citation integrity, S3-compatible namespace trust, retrieval-label scopes, installed/workspace skills and tool-use definitions, evidence separation, Dreamer readiness, adapter drift, migration, paths, and secrets."
        type: "integration"
        priority: "P0"
        depends_on: ["P3-T03", "P3-T04", "P3-T06"]
        estimate: "M"
        owner_type: "qa-engineer"
        acceptance:
          - Doctor reports each subsystem independently with stable codes, actionable fixes, redacted detail, and JSON output.
          - Doctor treats no Brain configuration as healthy local-only operation, partial PostgreSQL/S3-compatible configuration as invalid without opening either service, and complete configuration as eligible for native Brain diagnostics.
          - Brain diagnostics distinguish unavailable generic secret references, unavailable services, workspace/database identity mismatch, schema or role drift, untrusted or misbound object namespace, source/object integrity failure, and incomplete ingest recovery without exposing credentials.
          - Doctor detects broken plan/tool refs, required-context overflow, invalid retrieval-label scopes, privacy/trust/current-version/tombstone violations, citation loss, unsafe object/embedding configuration, semantic evidence leakage, stale adapters, and incomplete migration.
          - It distinguishes Dreamer files from the end-to-end readiness/invocation/candidate/decision path and describes scopes as selection labels, not authorization boundaries.
          - No execution dry-run, external-provider authentication or health, provider response validation, schedule fire, step transition, lease, queue, or approval-authority check remains.

      - id: "P3-T08"
        tracker_issue_id: "367"
        title: "Rehearse adopter v2 cutover"
        description: "Run dry-run, backup, apply, doctor, and representative post-migration host-led workflows on sanitized frozen workspace snapshots; resolve every conflict and document the production cutover/rollback procedure without committing private live workspace data."
        type: "integration"
        priority: "P0"
        depends_on: ["P3-T05", "P3-T06", "P3-T07"]
        estimate: "L"
        owner_type: "qa-engineer"
        acceptance:
          - Sanitized snapshots cover local-only, complete PostgreSQL-plus-S3-compatible Brain, partial configuration, wrong identity, legacy paths, and preserve authored plans/guidelines/lessons, useful history, and reviewed tool intent.
          - Schedule/general-ops removal, Brain identity conversion, evidence import, generic secret references, and legacy-unverified classification match the dry run.
          - Claude Code and Codex complete distinct representative host-interpreted workflows with provider-neutral skill bindings and Dreamer learning after migration.
          - Backup, failure injection, idempotent rerun, rollback limits, operator checklist, and final doctor results are documented.
          - No private repository name, path, Brain content, credential, or live snapshot enters fixtures, issue requirements, logs, or release evidence.

      - id: "P3-T09"
        tracker_issue_id: "369"
        title: "Publish and release Roster v2"
        description: "Publish and release the host-interpreted plan, bounded context, first-party PostgreSQL-plus-S3-compatible Brain, provider-neutral tool-use guidance, portable evidence, Dreamer, migration, and security contracts; remove obsolete runtime/provider/schedule/ops documentation; pass release gates and ship the breaking version."
        type: "docs"
        priority: "P0"
        depends_on: ["P3-T08"]
        estimate: "L"
        owner_type: "devops-engineer"
        acceptance:
          - README, contributor docs, CLI help, schemas, examples, migration guide, security model, and package contents describe the same thin-layer product.
          - Documentation states that local scaffolding/context/tool guidance works offline; Brain is first-party and requires both compatible PostgreSQL and S3-compatible storage; embeddings are optional.
          - External tool examples are explicitly non-normative and docs require no named provider, secret manager, transport, or personal workspace.
          - No canonical docs or APIs mention plan compile/reduce/next/submit/approve, external-provider routing/execution/parsing, Roster scheduling, or general ops/HITL.
          - Full gates, focused hermetic integration/adversarial/migration tests, optional configured live smoke, secret scan, package smoke, and second-opinion review pass.
          - Release notes explain breaking removals, workspace migration, host ownership, Brain/tool-use/Dreamer behavior, and no-permanent-shim policy.
