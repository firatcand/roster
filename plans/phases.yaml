# This tracked file is a design/decomposition snapshot. GitHub owns live task
# status, assignment, sequencing, and blockers. Query GitHub for routine state
# reads and use read-only/dry-run reconciliation. Run a non-dry
# `forge orchestrate reconcile --pull` only when committing the resulting snapshot.
project: "roster-v2-context-framework"
gate_check_command: "pnpm typecheck && pnpm build && pnpm test && pnpm test:scaffold-scripts && pnpm smoke"
source:
  tracker: "github"
  project_id: "340"
  synced_at: "2026-08-05T08:44:51.407Z"
