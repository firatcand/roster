# gitleaks config for roster.
#
# Keep the full default ruleset everywhere (extend.useDefault), and allowlist
# ONLY dedicated secret-detection test fixtures. Those files intentionally
# contain secret-SHAPED strings (`sk-…`, `ghp_…`) as DETECTION fixtures for the
# scanner ported from forge — they are NOT real credentials. Scope is only the
# listed dedicated test files, so real-secret detection elsewhere is unaffected.
title = "roster gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Secret-detection test fixtures hold intentional fake secret-shaped strings"
paths = [
  '''test/tripwire-.*\.test\.ts''',
  '''test/authored-secret-detector\.test\.ts''',
]
