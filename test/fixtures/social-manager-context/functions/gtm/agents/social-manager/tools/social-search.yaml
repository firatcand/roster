schema_version: 2
id: social-search
scope:
  function: gtm
  agent: social-manager
purpose: Find timely posts from people and companies relevant to the target audience.
skill_ref: exa:search
how:
  - begin with a twenty-four hour lookback
filters:
  - reject profile and company-homepage URLs
output_expectations:
  required:
    - canonical_url
    - author
    - published_at
    - relevance_reason
  guidance:
    - return evidence rather than a drafted reply
effects:
  allowed:
    - external-read
    - brain-read
    - brain-write
