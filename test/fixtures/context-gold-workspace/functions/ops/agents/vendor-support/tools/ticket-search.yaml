schema_version: 2
id: ticket-search
scope:
  function: ops
  agent: vendor-support
purpose: Find precedent tickets by failure signature and vendor for triage verdicts.
skill_ref: torlvesk:tickets
how:
  - search the failure signature first and the vendor name second, recording both searched strings
filters:
  - restrict results to resolved tickets with an accepted fix recorded
output_expectations:
  required:
    - ticket_id
    - failure_signature
    - accepted_fix
  guidance:
    - return the precedent evidence, never a proposed action
effects:
  allowed:
    - external-read
    - brain-read
approval:
  requirement: none
  guidance: []
